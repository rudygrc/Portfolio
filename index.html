<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… — Portfolio</title>
<meta name="description" content="Software developer portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Bootstrap (grid + utilities) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- AOS (scroll-triggered animation library) -->
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

<!-- Our own styles load last, so they win the cascade over Bootstrap -->
<link rel="stylesheet" href="style/index_style.css">
</head>
<body>

<header>
  <nav class="wrap">
    <div class="logo" id="nav-logo"></div>
    <div class="nav-links">
      <a href="#work">~/work</a>
      <a href="#about">~/about</a>
      <a href="#contact">~/contact</a>
    </div>
    <div class="status" id="nav-status"></div>
  </nav>
</header>

<section class="hero bg-mesh-dark">
  <div class="wrap">
    <div class="eyebrow" id="hero-eyebrow"></div>
    <h1 id="hero-headline"></h1>
    <p class="sub" id="hero-sub"></p>
    <div class="stack-tags" id="hero-stack"></div>
    <div class="hero-cta">
      <a class="btn primary" href="#work">View work →</a>
      <a class="btn ghost" id="hero-email-link" href="#">Say hello</a>
    </div>
  </div>
</section>

<section id="work" class="bg-dot-grid">
  <div class="wrap">
    <div class="section-label"><span>$</span> git log --projects</div>
    <h2>Selected work</h2>
    <div class="log" id="work-log">
      <!-- project entries are rendered here by script.js from data.json -->
    </div>
  </div>
</section>

<section id="about" class="bg-topo">
  <div class="wrap">
    <div class="section-label"><span>$</span> cat about.md</div>
    <h2>About</h2>
    <div class="about-grid">
      <div id="about-bio" data-aos="fade-right">
        <!-- bio paragraphs rendered here -->
      </div>
      <div class="skills-col" id="about-skills" data-aos="fade-left" data-aos-delay="100">
        <!-- skill groups rendered here -->
      </div>
    </div>
  </div>
</section>

<section id="contact" class="bg-mesh-dark" style="border-bottom:none;">
  <div class="wrap">
    <footer>
      <div class="contact-head" id="footer-heading" data-aos="fade-up"></div>
      <div class="contact-links" id="footer-links" data-aos="fade-up" data-aos-delay="100">
        <!-- contact buttons rendered here -->
      </div>
      <div class="foot-meta" id="footer-meta">
        <!-- copyright + tagline rendered here -->
      </div>
    </footer>
  </div>
</section>

<!-- Bootstrap JS bundle (Popper + Bootstrap) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- AOS (scroll-triggered animation library) -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<!-- Our own script: fetches data.json, renders content, then starts AOS -->
<script src="javascript/index.js"></script>

</body>
</html>
